services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: emailsimple
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5434:5432"   # 5434 so it can run next to scheduled-email-dedup-demo (5433)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d emailsimple"]
      interval: 2s
      timeout: 3s
      retries: 20
