# Shadows src/main/resources/application.properties entirely, so it must be complete.
# Datasource comes from the Testcontainers Postgres (@ServiceConnection).
spring.application.name=scheduled-email-simple-demo
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
logging.level.org.hibernate.orm.jdbc.error=off
server.port=0

demo.user-count=1000
demo.max-attempts=3
demo.provider-failure-rate=0.3
demo.send-cron=-
demo.sweep-cron=-
