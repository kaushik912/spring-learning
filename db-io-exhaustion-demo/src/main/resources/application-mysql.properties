# Activate with: SPRING_PROFILES_ACTIVE=mysql
# Credentials are read from the environment - never hardcode them here.
# Example: SPRING_DATASOURCE_USERNAME=root SPRING_DATASOURCE_PASSWORD=... SPRING_PROFILES_ACTIVE=mysql ./mvnw spring-boot:run

spring.datasource.url=jdbc:mysql://localhost:3306/db_io_exhaustion_demo?useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MySQL is a real, external server reached over a TCP socket (even on
# localhost), unlike H2's in-memory embedded engine - that's the whole point
# of this profile. schema-mysql.sql resets the table on every startup so the
# demo starts from a clean, known state each run.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-mysql.sql

# Small dataset - the buggy query's slowness comes from an artificial delay
# (see mysql/MySqlBuggyOrderRepository), not from scanning a huge table.
app.seed.row-count=5000
