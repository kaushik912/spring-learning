spring.application.name=db-io-exhaustion-demo

spring.datasource.url=jdbc:h2:mem:dbio;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Small pool + short timeout so pool exhaustion from a slow query is
# reproducible with modest curl concurrency instead of needing hundreds
# of real clients.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=2000

management.endpoints.web.exposure.include=health,prometheus,metrics

# Row count for the synthetic dataset seeded on startup. Kept modest since
# SlowEmailMatcher (see buggy package) adds calibrated per-row cost to the
# buggy scan already - a huge table isn't needed to reproduce the timing.
app.seed.row-count=200000
