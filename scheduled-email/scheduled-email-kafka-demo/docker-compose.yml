services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9094:9094"   # 9094 so it can run next to duplicate-delivery-demo (9092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9094 > /dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 20

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: emailkafka
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5436:5432"   # 5436 so it can run next to the other email demos (5433-5435)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d emailkafka"]
      interval: 2s
      timeout: 3s
      retries: 20
