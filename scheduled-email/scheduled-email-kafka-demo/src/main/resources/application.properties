spring.application.name=scheduled-email-kafka-demo
server.port=8095

# Postgres + Kafka from docker-compose.yml (docker compose up -d --wait)
spring.datasource.url=jdbc:postgresql://localhost:5436/emailkafka
spring.datasource.username=demo
spring.datasource.password=demo
spring.sql.init.mode=always

spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=email-senders
# a new consumer group starts from the beginning, so messages published before it joined are not missed
spring.kafka.consumer.auto-offset-reset=earliest
# demo only: notice a kill -9'd consumer after ~10s instead of the 45s default, so the rebalance is quick
spring.kafka.consumer.properties.session.timeout.ms=10000
spring.kafka.consumer.properties.heartbeat.interval.ms=3000
# consumer threads per instance (topic has 6 partitions)
spring.kafka.listener.concurrency=2

demo.instance-id=instance-${server.port}
demo.user-count=1000
# Mock provider
demo.provider-latency-ms=30
demo.provider-failure-rate=0.2
# consumer "dies" after the provider accepted the email but before we record it (the dual-write gap)
demo.crash-after-send-rate=0.03
# blocking retries before dead-lettering: 1 original attempt + `retries` more
demo.retries=2
demo.retry-backoff-ms=500
# Spring 6-field cron; "-" disables. Real life would be daily e.g. "0 0 9 * * *".
demo.publish-cron=*/20 * * * * *
