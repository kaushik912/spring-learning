# Shadows src/main/resources/application.properties entirely, so it must be complete.
# Datasource and bootstrap servers come from the Testcontainers (@ServiceConnection).
spring.application.name=scheduled-email-kafka-demo
server.port=0
spring.sql.init.mode=always

spring.kafka.consumer.group-id=email-senders
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.concurrency=3

demo.instance-id=test-instance
demo.user-count=1000
demo.provider-latency-ms=1
demo.provider-failure-rate=0.3
demo.crash-after-send-rate=0.03
demo.retries=2
demo.retry-backoff-ms=50
demo.publish-cron=-
