spring.application.name=scheduled-email-simple-demo
server.port=8091

# Postgres from docker-compose.yml (docker compose up -d --wait)
spring.datasource.url=jdbc:postgresql://localhost:5434/emailsimple
spring.datasource.username=demo
spring.datasource.password=demo
spring.sql.init.mode=always
# Tables come from schema.sql (explicit); Hibernate only checks the entities match them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Hibernate logs every duplicate-key error we deliberately catch (overlapping runners); keep the log readable.
logging.level.org.hibernate.orm.jdbc.error=off

demo.user-count=1000
demo.max-attempts=3
# Mock provider returns a 503 for this fraction of calls
demo.provider-failure-rate=0.2
# Spring 6-field cron; "-" disables. Real life would be daily e.g. "0 0 9 * * *".
demo.send-cron=*/30 * * * * *
demo.sweep-cron=*/10 * * * * *
