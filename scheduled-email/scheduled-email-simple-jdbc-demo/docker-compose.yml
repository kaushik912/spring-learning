services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: emailsimplejdbc
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5435:5432"   # 5435 so it can run next to the other email demos (5433, 5434)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d emailsimplejdbc"]
      interval: 2s
      timeout: 3s
      retries: 20
