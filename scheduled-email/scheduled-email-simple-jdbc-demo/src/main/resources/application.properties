spring.application.name=scheduled-email-simple-jdbc-demo
server.port=8093

# Postgres from docker-compose.yml (docker compose up -d --wait)
spring.datasource.url=jdbc:postgresql://localhost:5435/emailsimplejdbc
spring.datasource.username=demo
spring.datasource.password=demo
spring.sql.init.mode=always

demo.user-count=1000
demo.max-attempts=3
# Mock provider returns a 503 for this fraction of calls
demo.provider-failure-rate=0.2
# Spring 6-field cron; "-" disables. Real life would be daily e.g. "0 0 9 * * *".
demo.send-cron=*/30 * * * * *
demo.sweep-cron=*/10 * * * * *
