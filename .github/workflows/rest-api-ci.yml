name: rest-api CI

on:
  push:
    branches: [master]
    paths:
      - 'rest-api/**'
  pull_request:
    branches: [master]
    paths:
      - 'rest-api/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rest-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: ./mvnw test
