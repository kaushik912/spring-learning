spring.application.name=idempotency-key-race-demo

spring.datasource.url=jdbc:h2:mem:idempotency;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update

spring.data.redis.host=localhost
spring.data.redis.port=6379

# The DB-fix endpoint deliberately triggers unique-constraint violations
# under concurrent load (that's the fix working) - keep the log quiet.
logging.level.org.hibernate.orm.jdbc.error=off
