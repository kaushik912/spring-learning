spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers}

spring.kafka.consumer.auto-offset-reset=earliest

# In-memory (not file-based) for tests - fast, isolated, nothing left on
# disk between runs. Restart-survival is proved separately (see
# DuplicateDeliveryReproductionTest's fresh-store-instance test) rather
# than by relying on this database file surviving anything.
spring.datasource.url=jdbc:h2:mem:duplicatedelivery-test;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
