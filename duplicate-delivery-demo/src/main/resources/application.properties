spring.application.name=duplicate-delivery-demo

# Real Kafka via docker-compose (docker compose up -d) for manual/interactive exploration.
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.auto-offset-reset=earliest

# File-based (not in-memory) so processed_event rows survive an actual
# restart of the app, not just a Spring context refresh.
spring.datasource.url=jdbc:h2:file:./data/duplicatedelivery;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
