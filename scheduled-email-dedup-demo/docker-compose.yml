services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: emaildedup
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5433:5432"   # 5433 to avoid clashing with a local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d emaildedup"]
      interval: 2s
      timeout: 3s
      retries: 20
