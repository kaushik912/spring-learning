# Shadows src/main/resources/application.properties entirely, so it must be complete.
# Datasource comes from the Testcontainers Postgres (@ServiceConnection).
spring.application.name=scheduled-email-dedup-demo
spring.sql.init.mode=always
server.port=0

demo.instance-id=test-instance
demo.user-count=1000
demo.publish-cron=-
demo.workers=4
demo.batch-size=10
demo.provider-latency-ms=1
demo.provider-failure-rate=0.10
demo.crash-after-send-rate=0.05
demo.claim-timeout-ms=1000
demo.reaper-interval-ms=300
