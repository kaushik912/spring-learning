spring.application.name=scheduled-email-dedup-demo
server.port=8081

# Postgres from docker-compose.yml (docker compose up -d --wait)
spring.datasource.url=jdbc:postgresql://localhost:5433/emaildedup
spring.datasource.username=demo
spring.datasource.password=demo
spring.sql.init.mode=always

demo.instance-id=instance-${server.port}
demo.user-count=1000
# Publisher cron (Spring 6-field). "-" disables. Default: every minute at :00.
demo.publish-cron=0 * * * * *
demo.workers=4
demo.batch-size=10
# Mock provider chaos
demo.provider-latency-ms=5
demo.provider-failure-rate=0.05
# Worker "dies" after provider accepted but before marking SENT (the dual-write gap).
demo.crash-after-send-rate=0.03
# CLAIMED rows older than this are returned to PENDING by the reaper.
demo.claim-timeout-ms=10000
demo.reaper-interval-ms=3000
