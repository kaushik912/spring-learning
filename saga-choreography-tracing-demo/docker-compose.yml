x-service-env: &service-env
  DB_USER: saga
  DB_PASSWORD: saga
  KAFKA_BOOTSTRAP: kafka:9092
  # --- OTel Java agent config (zero-code) ---
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_METRICS_EXPORTER: none          # metrics come from Actuator/Prometheus instead
  OTEL_LOGS_EXPORTER: none             # logs stay on stdout (JSON, correlated via MDC)
  OTEL_BSP_SCHEDULE_DELAY: "500"       # flush spans quickly for a snappy demo
  OTEL_INSTRUMENTATION_SPRING_SCHEDULING_ENABLED: "false"  # no empty trace per scheduler tick
  OTEL_INSTRUMENTATION_KAFKA_EXPERIMENTAL_SPAN_ATTRIBUTES: "true"
  # Kafka consumer "process" spans are children of the producer span (traceparent header) -> one trace

x-service-deps: &service-deps
  postgres:
    condition: service_healthy
  kafka:
    condition: service_healthy
  otel-collector:
    condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saga
      POSTGRES_PASSWORD: saga
    volumes:
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI

  otel-collector:
    image: otel/opentelemetry-collector:0.111.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./docker/otel-collector.yaml:/etc/otel/config.yaml:ro
    depends_on:
      - jaeger

  order-service:
    build:
      context: .
      args:
        MODULE: order-service
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: order-service
      DB_URL: jdbc:postgresql://postgres:5432/orders
    ports:
      - "8080:8080"
    depends_on: *service-deps

  inventory-service:
    build:
      context: .
      args:
        MODULE: inventory-service
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: inventory-service
      DB_URL: jdbc:postgresql://postgres:5432/inventory
    ports:
      - "8081:8081"
    depends_on: *service-deps

  payment-service:
    build:
      context: .
      args:
        MODULE: payment-service
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: payment-service
      DB_URL: jdbc:postgresql://postgres:5432/payment
    ports:
      - "8082:8082"
    depends_on: *service-deps

  flow-tracker-service:
    build:
      context: .
      args:
        MODULE: flow-tracker-service
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: flow-tracker-service
      DB_URL: jdbc:postgresql://postgres:5432/flowtracker
    ports:
      - "8083:8083"
    depends_on: *service-deps
