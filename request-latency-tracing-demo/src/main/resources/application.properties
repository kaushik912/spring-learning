spring.application.name=request-latency-tracing-demo

management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Trace every request for this demo (never do 100% in real production traffic).
management.tracing.sampling.probability=1.0
# Real Zipkin via docker-compose (docker compose up -d) for manual/interactive exploration.
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
